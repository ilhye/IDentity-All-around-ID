{% extends 'layout.html' %} 
{% block styles %}
<link
  rel="stylesheet"
  href="{{ url_for('auth.static', filename='get-started.css') }}"
/>{% endblock %} 
{% block auth %}
<div class="text-center d-flex flex-column justify-content-center align-items-center mt-5 p-5">
    <h1 class="question w-75 .fs-3" id="speak-1">
        Do you identify with any of the following accessibility needs? <br />
        <b>Select all that apply</b> <br />
        <img id="text-to-speech"
             src="{{ url_for('pages.static', filename='images/volume-up.svg')}}"
             alt="speech"
             onclick="textToSpeech(this)" />
    </h1>
        <button class="impairment-btn fs-5" id="speak-2" onclick="setAccessibility('vision')"><a href="{{ url_for('auth.login') }}">Impaired Vision</a></button>
        <button class="impairment-btn fs-5" id="speak-3" onclick="setAccessibility('mobility')"><a href="{{ url_for('auth.login') }}">Mobility</a></button>
</div>

{% block scripts %}
<script src="{{ url_for('static', filename='voice.js') }}"></script>
{% endblock %}
{% endblock %}
