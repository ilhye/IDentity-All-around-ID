<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link
      rel="stylesheet"
      href="{{url_for('pages.static', filename='css/layout.css')}}"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>IDetity-all-around-ID</title>
    {% block styles %}{% endblock %}
  </head>
  <body>
    <div class="container-fluid">
      {% if include_navbar %}
      <div class="logo mb-2">
        <h5 class="logo-text text-center m-0 text-white">IDentity</h5>
      </div>
      {% endif %} {% block body %}{% endblock %}
    </div>
    {% block scripts %}
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const accessibility = sessionStorage.getItem('accessibility');
        if (accessibility === 'vision' || accessibility === 'mobility') {
          const script = document.createElement('script');
          script.src = "{{ url_for('static', filename='voice.js') }}";
          document.body.appendChild(script);
        }
      });
    </script>
    {% endblock %}
  </body>
</html>
