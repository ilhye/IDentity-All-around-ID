<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet">
    <!--Font Awesome-->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet">
    <!--CSS file-->
    <link rel="stylesheet" href="{{url_for('pages.static', filename='css/homeprofile.css')}}"/>
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">

        <!-- Sidebar -->
        <aside class="sidebar col-md-3">
          <h2 class="text-center">IDentity</h2>
          <nav>
            <ul class="list-unstyled">
              <li>
                <i class="fa-solid fa-id-card"></i>
                <a href="#id" class="id">ID's</a>
              </li>
              <li>
                <i class="fa-solid fa-user"></i>
                <a href="#profile" class="profile">Profile</a>
              </li>
              <li>
                <i class="fa-solid fa-bell"></i>
                <a href="#notifications" class="notification">Notification</a>
              </li>
              <li>
                <i class="fa-solid fa-gear"></i>
                <a href="#settings" class="setting">Settings</a>
              </li>
            </ul>
          </nav>
        </aside>

        <!-- Main Content -->
        <main class="col-md-9 ms-auto p-5">
          <!-- Profile Header -->
          <header class="header mb-4">
            <h1 class="profile-title">Profile</h1>

            <div class="search-container">
              <input
                type="text"
                class="search-bar"
                placeholder="Search here..."
                aria-label="Search" />
              <button class="search-button"><i
                  class="fa-solid fa-magnifying-glass"></i></button>
            </div>
          </header>

          <!-- Profile Section -->
          <section id="profile" class="container-fluid">
            <div class="row justify-content-start">
              <div class="col-md-12">
              </div>
              <div class="col-md-2">
                <div class="profile-header">
                  <div class="rounded-circle"
                    style="width: 100px; height: 100px;"></div>
                </div>
              </div>
              <div class="col-md-3">
                <div class="profile-header2">
                  <h2>@username</h2>
                  <p>John Doe</p>
                </div>
              </div>
            </div>
          </section>

          <!-- Personal Information Section -->
          <div class="personal-info-section">
            <div
              class="section-header">
              <h3 class="section-title mb-0">Personal Information</h3>
              <button class="edit-btn btn btn-primary">
                Edit <i class="fa-solid fa-pencil"></i>
              </button>
            </div>
            <form>
              <div class="row g-3">
                <!-- Row 1: First Name, Middle Name, Last Name, Extension -->
                <div class="col-md-10">
                  <div class="row">
                    <!-- I put the extra row here. Sorry about that lol -->
                    <div class="col-md-4">
                      <label for="first-name" class="form-label">First
                        Name:</label>
                      <input type="text" class="form-control" id="first-name"
                        name="first-name">
                    </div>
                    <div class="col-md-4">
                      <label for="middle-name" class="form-label">Middle
                        Name:</label>
                      <input type="text" class="form-control" id="middle-name"
                        name="middle-name">
                    </div>
                    <div class="col-md-4">
                      <label for="last-name" class="form-label">Last
                        Name:</label>
                      <input type="text" class="form-control" id="last-name"
                        name="last-name">
                    </div>
                  </div>
                </div>

                <div class="col-md-2">
                  <label for="extension" class="form-label">Extension:</label>
                  <input type="text" class="form-control" id="extension"
                    name="extension">
                </div>

                <!-- Row 2: Sex, Civil Status, Nationality -->
                <div class="col-md-4">
                  <label for="sex" class="form-label">Sex:</label>
                  <input type="text" class="form-control" id="sex" name="sex">
                </div>
                <div class="col-md-4">
                  <label for="civil-status" class="form-label">Civil
                    Status:</label>
                  <input type="text" class="form-control" id="civil-status"
                    name="civil-status">
                </div>
                <div class="col-md-4">
                  <label for="nationality"
                    class="form-label">Nationality:</label>
                  <input type="text" class="form-control" id="nationality"
                    name="nationality">
                </div>

                <!-- Row 3: Birthday, Birthplace, Occupation -->
                <div class="col-md-4">
                  <label for="birthdate" class="form-label">Birthday:</label>
                  <input type="date" class="form-control" id="birthdate"
                    name="birthdate">
                </div>
                <div class="col-md-4">
                  <label for="birthplace"
                    class="form-label">Birthplace:</label>
                  <input type="text" class="form-control" id="birthplace"
                    name="birthplace">
                </div>
                <div class="col-md-4">
                  <label for="occupation"
                    class="form-label">Occupation:</label>
                  <input type="text" class="form-control" id="occupation"
                    name="occupation">
                </div>

                <!-- Row 4: Father's Name, Occupation -->
                <div class="col-md-8">
                  <label for="father-name" class="form-label">Father's
                    Name:</label>
                  <input type="text" class="form-control" id="father-name"
                    name="father-name">
                </div>
                <div class="col-md-4">
                  <label for="father-occupation"
                    class="form-label">Occupation:</label>
                  <input type="text" class="form-control"
                    id="father-occupation" name="father-occupation">
                </div>

                <!-- Row 5: Mother's Name, Occupation -->
                <div class="col-md-8">
                  <label for="mother-name" class="form-label">Mother's
                    Name:</label>
                  <input type="text" class="form-control" id="mother-name"
                    name="mother-name">
                </div>
                <div class="col-md-4">
                  <label for="mother-occupation"
                    class="form-label">Occupation:</label>
                  <input type="text" class="form-control"
                    id="mother-occupation" name="mother-occupation">
                </div>
              </div>
            </form>
          </div>

          <!-- Contact Information -->
          <div class="contact-info">
            <div class="section-header">
              <h3>Contact Information</h3>
              <button class="edit-btn">
                Edit <i class="fa fa-pencil"></i>
              </button>
            </div>
            <form>
              <!-- Email -->
              <div class="mb-3 row">
                <label for="email" class="col-md-2">Email:</label>
                <div class="col-md-7">
                  <input type="email" id="email" name="email"
                    class="form-control">
                </div>
              </div>

              <!-- Phone Number -->
              <div class="mb-3 row">
                <label for="phone-number" class="col-md-2">Phone Number:</label>
                <div class="col-md-7">
                  <input type="phone" id="phone" name="phone"
                    class="form-control">
                </div>
              </div>

              <!-- Current Address -->
              <div class="mb-3 row">
                <label for="current-address" class="col-md-2">Current
                  Address:</label>
                <div class="col-md-7">
                  <!-- Updated from col-md-6 to col-md-7 -->
                  <div class="row">
                    <div class="col-md-6">
                      <input type="text" id="country" name="country"
                        class="form-control" placeholder="Country">
                    </div>
                    <div class="col-md-6">
                      <input type="text" id="region" name="region"
                        class="form-control" placeholder="Region">
                    </div>
                  </div>

                  <div class="row mt-2">
                    <div class="col-md-6">
                      <input type="text" id="city" name="city"
                        class="form-control" placeholder="City/Municipality">
                    </div>
                    <div class="col-md-6">
                      <input type="text" id="province" name="province"
                        class="form-control" placeholder="Province">
                    </div>
                  </div>

                  <div class="row mt-2">
                    <div class="col-md-6">
                      <input type="text" id="barangay" name="barangay"
                        class="form-control" placeholder="Barangay">
                    </div>
                    <div class="col-md-6">
                      <input type="text" id="street" name="street"
                        class="form-control"
                        placeholder="Block, Lot, Street, Floor">
                    </div>
                  </div>

                  <div class="row mt-2">
                    <div class="col-md-6">
                      <input type="text" id="zip" name="zip"
                        class="form-control" placeholder="ZIP Code">
                    </div>
                    <div class="col-md-6">
                      <input type="text" id="additional" name="additional"
                        class="form-control"
                        placeholder="Additional Information">
                    </div>
                  </div>
                </div>
              </div>

            </form>
          </div>

          <!-- Account Information -->
          <div class="account-info">
            <div
              class="section-header">
              <h3 class="section-title mb-0">Account Information</h3>
              <button class="edit-btn btn btn-primary">
                Edit <i class="fa-solid fa-pencil"></i>
              </button>
            </div>
            <form>
              <div class="mb-3 row">
                <label for="phone-number" class="col-md-3">Username:</label>
                <div class="col-md-6">
                  <input type="text" id="username" name="username"
                    class="form-control">
                </div>
              </div>
              <div class="mb-3 row">
                <label for="password" class="col-md-3">Password:</label>
                <div class="col-md-6">
                  <input type="password" id="password" name="password"
                    class="form-control">
                </div>
              </div>
              <div class="mb-3 row">
                <label for="password-confirmation" class="col-md-3">Confirm
                  Password:</label>
                <div class="col-md-6">
                  <input type="password" id="password-confirmation"
                    name="password-confirmation" class="form-control">
                </div>
              </div>
            </form>
          </div>

          <!-- Identification Details -->
          <div class="identification-info">
            <div
              class="section-header">
              <h3 class="section-title mb-0">Identification Details</h3>
              <button class="edit-btn btn btn-primary">
                Edit <i class="fa-solid fa-pencil"></i>
              </button>
            </div>
            <form>
              <div class="mb-3 row">
                <label for="profile-photo" class="col-md-3">Profile
                  Photo:</label>
                <div class="col-md-6">
                  <input type="file" class="form-control" id="profile-photo"
                    name="profile-photo">
                </div>
              </div>

              <div class="mb-3 row">
                <label for="ss-number" class="col-md-3">Social Security
                  Number:</label>
                <div class="col-md-6">
                  <input type="text" class="form-control" id="ss-number"
                    name="ss-number">
                </div>
              </div>

              <div class="mb-3 row">
                <label for="ph-number" class="col-md-3">PhilHealth
                  Number:</label>
                <div class="col-md-6">
                  <input type="text" class="form-control" id="ph-number"
                    name="ph-number">
                </div>
              </div>

              <div class="mb-3 row">
                <label for="philsys-number" class="col-md-3">National ID
                  Number:</label>
                <div class="col-md-6">
                  <input type="text" class="form-control" id="philsys-number"
                    name="philsys-number">
                </div>
              </div>

              <div class="mb-3 row">
                <label for="birth-certificate" class="col-md-3">Birth
                  Certificate:</label>
                <div class="col-md-6">
                  <input type="file" class="form-control" id="birth-certificate"
                    name="birth-certificate">
                </div>
              </div>

            </form>
          </div>

          <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
        </body>
      </html>
