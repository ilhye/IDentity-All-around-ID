<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Page</title>
    <link rel="stylesheet" href="test.css">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            
                <span class="menu-item-identity-active">IDentity</span>
            <div class="menu-item">
                <i class='bx bx-id-card'></i>
                <span>ID's</span>
            </div>
            <div class="menu-item">
                <i class='bx bx-user-circle'></i>
                <span>Profile</span>
            </div>
            <div class="menu-item-active">
                <i class='bx bxs-bell'></i>
                <span>Notification</span>
            </div>
            <div class="menu-item">
                <i class='bx bx-cog'></i>
                <span>Settings</span>
            </div>
        </aside>
        <main class="main-content">
            <header>
                <h1>Notification</h1>
                <div class="search-filter">
                    <div class="search-box">
                        <input type="text" placeholder="Search here...">
                        <i class='bx bx-search'></i>
                    </div>
                    <div>
                    <i class='bx bx-filter-alt'></i>
                    <span>Filter</span>
                    </div>
                </div>
            </header>
            <section class="notifications">
                <div class="notification-item">
                    <div class="icon"></div>
                    <div class="details">
                        <p>Your Driver’s License ID is expired</p>
                        <button class="renew-button">Renewal</button>
                        <span class="timestamp">10:56 am 10/10/2024</span>
                    </div>
                </div>
                <div class="notification-item">
                    <div class="icon"></div>
                    <div class="details">
                        <p>Check your ID availability</p>
                        <button class="renew-button">Renewal</button>
                        <span class="timestamp">10:56 am 10/10/2024</span>
                    </div>
                </div>
                <div class="notification-item">
                    <div class="icon"></div>
                    <div class="details">
                        <p>Your Driver’s License ID is expired</p>
                        <button class="renew-button">Renewal</button>
                        <span class="timestamp">10:56 am 10/10/2024</span>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
